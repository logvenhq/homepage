<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F8FAFC">
    <meta name="description" content="{{ config.description }}">
    <meta name="robots" content="index,follow">
    <meta property="og:site_name" content="{{ config.title }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ config.title }}">
    <meta property="og:description" content="{{ config.description }}">
    <meta property="og:image" content="{{ get_url(path='images/home/social-preview.png') }}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Logven">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ get_url(path='images/home/social-preview.png') }}">
    <meta name="twitter:image:alt" content="Logven">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ get_url(path='apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ get_url(path='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ get_url(path='favicon-16x16.png') }}">
    <link rel="icon" href="{{ get_url(path='favicon.ico') }}" sizes="any">
    <link rel="manifest" href="{{ get_url(path='site.webmanifest') }}">
    <link rel="stylesheet" href="{{ get_url(path='css/style.css', cachebust=true) }}">
    <title>{{ config.title }}</title>
  </head>
  <body class="is-home">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <main id="main-content">
      {% block content %}{% endblock content %}
    </main>

    <footer id="contacts" class="site-footer">
      <nav class="site-footer__nav" aria-label="Footer navigation">
        <span class="site-footer__rule site-footer__rule--large" aria-hidden="true"></span>
        <a href="mailto:contact@logven.com">Contact us</a>
        <span class="site-footer__rule site-footer__rule--small" aria-hidden="true"></span>
        <a href="#stories">Stories</a>
      </nav>
    </footer>
  </body>
</html>
